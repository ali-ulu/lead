name: Fast live verification

on:
  push:
    paths:
      - "scripts/live_smoke_fast.py"
      - ".github/workflows/live-fast.yml"
      - "lead_hunter/providers/osm.py"
      - "lead_hunter/providers/nominatim.py"
      - "lead_hunter/providers/overture.py"
      - "lead_hunter/merge.py"
      - "lead_hunter/services.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: leadscout-fast-live
  cancel-in-progress: true

jobs:
  fast-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python scripts/live_smoke_fast.py

name: Agent API smoke

on:
  push:
    paths:
      - "mcp_server.py"
      - "server.py"
      - "lead_hunter/services.py"
      - "lead_hunter/exporters.py"
      - "lead_hunter/providers/osm.py"
      - "lead_hunter/providers/nominatim.py"
      - "pyproject.toml"
      - "scripts/mcp_smoke.py"
      - "scripts/mcp_http_smoke.py"
      - ".github/workflows/agent-smoke.yml"

permissions:
  contents: read

concurrency:
  group: leadscout-agent-smoke
  cancel-in-progress: true

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[agents]"
      - run: python scripts/mcp_smoke.py
      - name: Smoke Streamable HTTP transport
        run: |
          python mcp_server.py --transport streamable-http --host 127.0.0.1 --port 8790 >/tmp/leadscout-mcp.log 2>&1 &
          MCP_PID=$!
          trap 'kill $MCP_PID || true' EXIT
          sleep 2
          python scripts/mcp_http_smoke.py

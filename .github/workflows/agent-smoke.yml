name: Agent API smoke

on:
  push:
    paths:
      - "mcp_server.py"
      - "lead_hunter/services.py"
      - "lead_hunter/exporters.py"
      - "pyproject.toml"
      - "scripts/mcp_smoke.py"
      - ".github/workflows/agent-smoke.yml"

permissions:
  contents: read

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "mcp>=2,<3"
      - run: python scripts/mcp_smoke.py

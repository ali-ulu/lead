name: Live provider smoke

on:
  push:
    paths:
      - "lead_hunter/providers/osm.py"
      - "lead_hunter/providers/nominatim.py"
      - "lead_hunter/services.py"
      - "scripts/live_smoke.py"
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: read

concurrency:
  group: leadscout-live-provider-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    # Uncapped live discovery is slow and provider-bound: a dense Karachi scan
    # alone can take ~12 minutes, and the three markets together exceed the old
    # 15-minute cap, so the job was killed before finishing and could never go
    # green. Keep the uncapped path but give it enough headroom.
    timeout-minutes: 35
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Run live multi-country uncapped smoke
        run: python scripts/live_smoke.py

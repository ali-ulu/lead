[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadscout-local-business-scout"
version = "7.0.0"
description = "Local business discovery, multi-source enrichment, CRM, agent API, MCP and social outreach"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "cryptography>=43,<46",
]

[project.optional-dependencies]
agents = ["mcp>=2,<3"]

[tool.setuptools]
packages = ["lead_hunter"]
